<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <script src="https://verification.zjb522.cn/sdk/shield-verify.js?v=1.0.3"></script>
    <script src="/static/sober.min.js"></script>
    <link rel="stylesheet" href="/static/signup/index.css">
    <meta name="description" content="VV账号注册">
</head>

<body>
    <noscript>
        <div style="position: fixed;top: 0;left: 0;width: 100vw;height: 100vh;background-color: white;">
            <center>
                <h1>您的浏览器不支持JavaScript，请升级您的浏览器。</h1>
            </center>
        </div>
    </noscript>
    <div id="app">
        <div class="header">
            <div class="logo">VV</div>
            <h1>用户注册</h1>
            <p>创建你的 VV 账号</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>注册信息</h2>
                <form id="registerForm">
                    <div class="field">
                        <s-text-field id="user" label="用户名" type="text"class="full-width"></s-text-field>
                        <s-button id="random_username" type="outlined" class="random-btn">随机用户名</s-button>
                    </div>

                    <div class="field">
                        <s-text-field id="password" label="密码" type="password" class="full-width">
                            <div slot="text">至少8位</div>
                        </s-text-field>
                    </div>

                    <div class="field">
                        <s-text-field id="confirmPassword" label="确认密码" type="password" class="full-width">
                            <div slot="text">请再次输入密码</div>
                        </s-text-field>
                    </div>

                    <div class="field">
                        <s-text-field id="email" label="邮箱" type="text" class="full-width">
                            <div slot="text">邮箱地址</div>
                        </s-text-field>
                    </div>

                    <div class="field">
                        <div class="verify-row">
                            <s-text-field id="emailVerifyCode" label="邮箱验证码" type="text" class="verify-input">
                                <div slot="text">验证码</div>
                            </s-text-field>
                            <s-button id="getCode" type="outlined" class="verify-btn">获取验证码</s-button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="file-label">头像</label>
                        <div class="file-picker">
                            <input type="file" id="avatar" accept="image/*" class="file-input">
                            <s-button class="file-btn">选择头像</s-button>
                            <span class="file-name">未选择文件</span>
                        </div>
                    </div>

                    <div class="shield-verify" data-sitekey="SV-ff0bf0a511d75530e568bfc25345" data-callback="onVerifySuccess"
                        data-lang="zh" style="display: flex; justify-content: center;"></div>

                    <div class="submit-row">
                        <s-button class="submit-btn" onclick="document.getElementById('registerForm').requestSubmit()">注册</s-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('avatar');
            const btn = document.querySelector('.file-btn');
            const name = document.querySelector('.file-name');
            btn && btn.addEventListener('click', () => input && input.click());
            input && input.addEventListener('change', () => {
                if (input.files && input.files[0]) {
                    name.textContent = input.files[0].name;
                } else {
                    name.textContent = '未选择文件';
                }
            });
        });
    </script>
    <script src="/static/signup/index.js"></script>
</body>

</html>
