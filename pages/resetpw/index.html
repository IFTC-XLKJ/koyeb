<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码</title>
    <script src="/static/sober.min.js"></script>
    <link rel="stylesheet" href="/static/resetpw/index.css">
    <meta name="description" content="VV账号重置密码">
</head>

<body>
    <noscript>
        <div style="position: fixed;top: 0;left: 0;width: 100vw;height: 100vh;background-color: white;">
            <center>
                <h1>您的浏览器不支持JavaScript，请升级您的浏览器。</h1>
            </center>
        </div>
    </noscript>
    <div id="app">
        <div class="header">
            <div class="logo">VV</div>
            <h1>重置密码</h1>
            <p>请输入账号信息以重置密码</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>重置密码</h2>
                <div class="tip">
                    <p>如果忘记用户ID，请联系管理员</p>
                </div>
                <form id="resetpwForm">
                    <div class="field">
                        <s-text-field id="ID" label="用户ID" type="number" placeholder="请输入用户ID" class="full-width"></s-text-field>
                    </div>

                    <div class="field">
                        <s-text-field id="email" label="邮箱（注册使用的邮箱）" type="text" placeholder="邮箱地址" class="full-width"></s-text-field>
                    </div>

                    <div class="field">
                        <s-text-field id="password" label="新密码" type="password" placeholder="新密码（至少8位）" class="full-width"></s-text-field>
                    </div>

                    <div class="submit-row">
                        <s-button class="submit-btn" onclick="document.getElementById('resetpwForm').requestSubmit()">重置密码</s-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/static/resetpw/index.js"></script>
</body>

</html>
