<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VV用户中心 - {{username}}</title>
    <link rel="stylesheet" href="/static/user/index.css">
    <script src="/static/Toast.js"></script>
    <script src="/static/Dialog.js"></script>
    <script src="/static/sober.min.js"></script>
    <meta name='description' content='VV用户中心 - {{username}}'>
</head>

<body>
    <noscript>
        <div style="position: fixed;top: 0;left: 0;width: 100vw;height: 100vh;background-color: white;">
            <center>
                <h1>您的浏览器不支持JavaScript，请升级您的浏览器。</h1>
            </center>
        </div>
    </noscript>
    <div id="app">
        <div class="header">
            <img src="{{avatar}}" alt="用户头像" class="user-avatar" onerror="this.src='/static/avatar.png'"
                draggable="false">
            <h1>VV用户中心</h1>
            <p>欢迎，{{username}}</p>
        </div>
        <div class="content">
            <div class="user-info">
                <h2>个人信息</h2>
                <p>用户ID: {{id}}</p>
                <p>用户名: {{username}}</p>
                <p>V币: {{vc}}</p>
                <p>邮箱: {{email}}</p>
                <p>注册时间: {{registrationDate}}</p>
                <p>更新时间：{{updatedDate}}</p>
                <div class="token-section">
                    <p>Token:</p>
                    <div class="token-row">
                        <code id="token-display" class="token-value">加载中...</code>
                        <s-icon-button id="copy-token" type="standard">
                            <s-icon
                                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z'/%3E%3C/svg%3E"></s-icon>
                        </s-icon-button>
                    </div>
                </div>
            </div>
            <div class="user-actions">
                <h2>操作</h2>
                <s-button id="sign-in">每日签到</s-button>
                <s-button id="update-username">更新用户名</s-button>
                <s-button id="update-avatar">更新头像</s-button>
                <s-button id="change-password">修改密码</s-button>
                <s-button id="logout">退出登录</s-button>
            </div>
            <div>
                <h2>兑换V币</h2>
                <div style="display: grid;grid-template-columns: 1fr auto;">
                    <s-text-field id="redeem-code" label="兑换码，格式：XXXX-XXXX-XXXX-XXXX" type="text"></s-text-field>
                    <s-button id="redeem-button">兑换</s-button>
                </div>
            </div>
        </div>
    </div>
    <slot data="username">{{username}}</slot>
    <script src="/static/user/index.js"></script>
</body>

</html>
